<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Session Buddy</title>
<style>
  :root {
    --bg: #0e1014;
    --card: #161a21;
    --card-hi: #1c212a;
    --text: #e8e8e6;
    --muted: #8a9099;
    --border: #1f242c;
    --amber: #d9a441;
    --red: #d9534f;
    --green: #5ec26a;
    --accent-user: #5eb1ef; /* overwritten from the OS accent color once fetched */
    --accent0: #5eb1ef; --accent1: #7ee0a8; --accent2: #e0a15e;
    --accent3: #c792ea; --accent4: #ef7e9b; --accent5: #7ee0d0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 13px; overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    -webkit-app-region: drag; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header .title { font-weight: 600; flex: 1; }
  header button {
    -webkit-app-region: no-drag; background: none; border: 1px solid #2a303a; color: var(--muted);
    border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 13px;
  }
  header button.active { color: var(--text); border-color: var(--accent-user); }
  #tabs {
    display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 10px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    background: none; border: 1px solid transparent; color: var(--muted); font: inherit;
    border-radius: 6px; padding: 4px 9px; cursor: pointer; white-space: nowrap; display: flex; gap: 5px; align-items: center;
    flex: 1 1 auto; justify-content: center;
  }
  .tab .count { color: var(--muted); font-size: 11px; }
  .tab.active { background: var(--card-hi); color: var(--text); border-color: #2a303a; }
  .tab.active .dot { box-shadow: 0 0 0 2px var(--accent-user); }
  main { flex: 1; overflow-y: auto; padding: 8px 10px 24px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }

  .agent {
    background: var(--card); border-radius: 10px; padding: 10px 11px; margin-bottom: 8px;
    border-left: 3px solid #333; animation: fadein .16s ease-out; cursor: pointer;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .agent.sess-0 { border-left-color: var(--accent0); }
  .agent.sess-1 { border-left-color: var(--accent1); }
  .agent.sess-2 { border-left-color: var(--accent2); }
  .agent.sess-3 { border-left-color: var(--accent3); }
  .agent.sess-4 { border-left-color: var(--accent4); }
  .agent.sess-5 { border-left-color: var(--accent5); }

  .agent-head { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--muted); }
  .agent.state-active .dot { background: var(--green); }
  .agent.state-waiting .dot { background: var(--amber); animation: pulse 1.8s ease-in-out infinite; }
  .agent.state-error .dot { background: var(--red); }
  .agent.state-inactive .dot { background: var(--muted); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .agent-label { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-meta { color: var(--muted); font-size: 11px; white-space: nowrap; }

  .agent-activity {
    color: var(--text); font-size: 12.5px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .agent.expanded .agent-activity { -webkit-line-clamp: unset; }
  .agent-since { color: var(--muted); font-size: 11px; margin-top: 3px; }

  .subagents { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); }
  .subagents-summary { color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 5px; }
  .sub-row {
    display: flex; gap: 6px; align-items: baseline; font-size: 11.5px; padding: 3px 0 3px 4px;
    border-left: 2px solid #2a303a; margin-top: 4px;
  }
  .sub-row .dot { width: 6px; height: 6px; }
  .sub-row.state-running .dot { background: var(--green); }
  .sub-row.state-done .dot { background: var(--muted); }
  .sub-row.state-stale .dot { background: var(--amber); }
  .sub-desc { font-weight: 600; flex-shrink: 0; }
  .sub-activity { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .history { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .history-row {
    font-size: 11.5px; color: var(--muted); padding: 3px 0; overflow-wrap: anywhere;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .history-row b { color: var(--text); font-family: inherit; }
  .history-empty { color: var(--muted); font-size: 11.5px; font-style: italic; }
</style>
</head>
<body>
<header>
  <span class="title">AI Session Buddy</span>
  <button id="pin" class="active" title="Keep on top">📌</button>
  <button id="close" title="Close">✕</button>
</header>
<div id="tabs"></div>
<main id="feed"></main>
<script>
(function () {
  let seq = 0;
  let sessions = [];
  let activeTab = 'all';
  const expanded = new Set();
  const history = {}; // sessionId -> [{ts, kind, title, body}], newest first, capped
  const HISTORY_CAP = 40;

  const feed = document.getElementById('feed');
  const tabsEl = document.getElementById('tabs');

  const TABS = [
    { key: 'all', label: 'All' },
    { key: 'active', label: 'Active' },
    { key: 'waiting', label: 'Waiting' },
    { key: 'error', label: 'Error' },
    { key: 'inactive', label: 'Inactive' },
  ];

  function escapeHtml(s) {
    return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtTokens(n) {
    return (n / 1e6).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'M left';
  }

  function fmtSince(iso) {
    if (!iso) return '';
    const diffS = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (diffS < 60) return diffS + 's ago';
    if (diffS < 3600) return Math.floor(diffS / 60) + 'm ago';
    if (diffS < 86400) return Math.floor(diffS / 3600) + 'h ago';
    return Math.floor(diffS / 86400) + 'd ago';
  }

  function renderTabs() {
    const counts = { all: sessions.length, active: 0, waiting: 0, error: 0, inactive: 0 };
    sessions.forEach(function (s) { counts[s.category] = (counts[s.category] || 0) + 1; });
    tabsEl.innerHTML = '';
    TABS.forEach(function (t) {
      const btn = document.createElement('button');
      btn.className = 'tab' + (activeTab === t.key ? ' active' : '');
      btn.innerHTML = '<span class="dot' + (t.key !== 'all' ? ' state-' + t.key : '') + '"></span>' +
        escapeHtml(t.label) + '<span class="count">' + (counts[t.key] || 0) + '</span>';
      btn.addEventListener('click', function () { activeTab = t.key; render(); });
      tabsEl.appendChild(btn);
    });
  }

  function renderSubagents(session) {
    const subs = session.subagents || [];
    if (!subs.length) return '';
    const running = subs.filter(function (s) { return s.state === 'running'; }).length;
    const rows = subs.slice(0, 8).map(function (s) {
      return '<div class="sub-row state-' + escapeHtml(s.state) + '">' +
        '<span class="dot"></span>' +
        '<span class="sub-desc">' + escapeHtml(s.description || 'Subagent') + '</span>' +
        '<span class="sub-activity">' + escapeHtml(s.last_activity || s.state) + '</span>' +
        '</div>';
    }).join('');
    return '<div class="subagents">' +
      '<div class="subagents-summary">' + subs.length + ' subagent' + (subs.length > 1 ? 's' : '') +
      (running ? ' · ' + running + ' running' : '') + '</div>' + rows + '</div>';
  }

  function renderHistory(session) {
    const rows = (history[session.id] || []);
    if (!rows.length) return '<div class="history"><div class="history-empty">No activity yet this session.</div></div>';
    return '<div class="history">' + rows.slice(0, HISTORY_CAP).map(function (b) {
      return '<div class="history-row"><b>' + escapeHtml(b.kind) + '</b> ' + escapeHtml(b.title) +
        (b.body ? ' — ' + escapeHtml(b.body.slice(0, 160)) : '') + '</div>';
    }).join('') + '</div>';
  }

  // Every field is written through one of these two, and both skip the DOM write when the
  // value hasn't actually changed. That's the whole flicker fix: earlier versions replaced
  // a card's full innerHTML on any change, which tears down and rebuilds every child node
  // (restarting CSS animations, forcing a repaint) even when e.g. only the activity text
  // changed. A session with active subagents updates almost every poll tick, so that was
  // visibly flickering constantly. Now only the specific text/markup that changed is touched.
  function setText(el, text) {
    if (el && el.textContent !== text) el.textContent = text;
  }
  function setHtml(el, html) {
    if (el && el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
  }

  function buildCardSkeleton(id, onClick) {
    const card = document.createElement('div');
    card.id = 'agent-' + id;
    card.innerHTML =
      '<div class="agent-head"><span class="dot"></span>' +
      '<span class="agent-label"></span><span class="agent-meta"></span></div>' +
      '<div class="agent-activity"></div><div class="agent-since"></div>' +
      '<div class="agent-subagents"></div><div class="agent-history"></div>';
    card.addEventListener('click', onClick);
    return card;
  }

  function updateCard(card, s) {
    const className = 'agent state-' + s.category + ' sess-' + (s.color_index % 6) +
      (expanded.has(s.id) ? ' expanded' : '');
    if (card.className !== className) card.className = className;

    let meta = '';
    if (s.model_name) meta += s.model_name;
    if (s.tokens_left != null) meta += (meta ? ' · ' : '') + fmtTokens(s.tokens_left);

    setText(card.querySelector('.agent-label'), s.label);
    setText(card.querySelector('.agent-meta'), meta);
    setText(card.querySelector('.agent-activity'), s.activity);
    setText(card.querySelector('.agent-since'), fmtSince(s.activity_ts));
    setHtml(card.querySelector('.agent-subagents'), renderSubagents(s));
    setHtml(card.querySelector('.agent-history'), expanded.has(s.id) ? renderHistory(s) : '');
  }

  // Reconciles the DOM against `sessions` instead of rebuilding it: existing cards are
  // updated field-by-field. Ordering uses a single-cursor walk (insertBefore only when a
  // card isn't already at the cursor) rather than blindly appendChild-ing every visible
  // card in order — appendChild-ing all N cards every tick physically detaches and
  // reattaches every card except the last one, even when the resulting order is unchanged,
  // which restarts each card's CSS fade-in animation on every single poll. That unconditional
  // reattach (confirmed via a MutationObserver + animationstart log: all cards fired
  // animationstart on every ~700ms tick, even with no content change) was the actual flicker
  // root cause; the innerHTML/textContent diffing added earlier was necessary but not
  // sufficient, since it never touched this reordering step.
  function render() {
    renderTabs();
    const visible = activeTab === 'all' ? sessions : sessions.filter(function (s) { return s.category === activeTab; });
    const visibleIds = {};
    visible.forEach(function (s) { visibleIds[s.id] = true; });

    Array.from(feed.children).forEach(function (el) {
      if (el.classList.contains('agent') && !visibleIds[el.id.slice('agent-'.length)]) el.remove();
    });

    if (!visible.length) {
      feed.innerHTML = '<div class="empty">' +
        (sessions.length ? 'Nothing in this view.' : 'No running Claude Code sessions yet.') + '</div>';
      return;
    }
    const emptyEl = feed.querySelector('.empty');
    if (emptyEl) emptyEl.remove();

    let cursor = feed.firstChild;
    visible.forEach(function (s) {
      let card = document.getElementById('agent-' + s.id);
      if (!card) {
        card = buildCardSkeleton(s.id, function () {
          if (expanded.has(s.id)) expanded.delete(s.id); else expanded.add(s.id);
          render();
        });
      }
      updateCard(card, s);
      if (card === cursor) {
        cursor = cursor.nextSibling; // already in the right place: zero DOM writes
      } else {
        feed.insertBefore(card, cursor); // only this one card actually moves
      }
    });
  }

  function recordHistory(b) {
    const list = history[b.session] || (history[b.session] = []);
    const existingIdx = list.findIndex(function (x) { return x.id === b.id; });
    if (existingIdx >= 0) list[existingIdx] = b; else list.unshift(b);
    if (list.length > HISTORY_CAP) list.length = HISTORY_CAP;
  }

  function apply(r) {
    if (!r || r.error) { if (r && r.error) console.error(r.error); return; }
    seq = r.seq;
    if (r.sessions) sessions = r.sessions;
    (r.new || []).forEach(recordHistory);
    (r.updated || []).forEach(recordHistory);
    render();
  }

  async function loop() {
    try {
      const r = await window.pywebview.api.poll(seq);
      apply(r);
    } catch (e) { console.error(e); }
    setTimeout(loop, 700);
  }

  setInterval(function () {
    document.querySelectorAll('.agent').forEach(function (card) {
      const s = sessions.find(function (x) { return 'agent-' + x.id === card.id; });
      const since = card.querySelector('.agent-since');
      if (s && since) since.textContent = fmtSince(s.activity_ts);
    });
  }, 1000);

  window.addEventListener('pywebviewready', function () {
    feed.innerHTML = '<div class="empty">No running Claude Code sessions yet.</div>';
    loop();
    window.pywebview.api.get_theme().then(function (theme) {
      if (theme && theme.accent) {
        document.documentElement.style.setProperty('--accent-user', theme.accent);
      }
    }).catch(function () {});
  });

  document.getElementById('pin').addEventListener('click', function () {
    this.classList.toggle('active');
    window.pywebview.api.set_on_top(this.classList.contains('active'));
  });
  document.getElementById('close').addEventListener('click', function () {
    window.pywebview.api.quit();
  });
})();
</script>
</body>
</html>
